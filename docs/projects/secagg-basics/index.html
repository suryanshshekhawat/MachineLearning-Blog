<meta charset="utf-8" />
<title>Secure Aggregation: basics</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff; --ink: #000000; --ink-soft: #5a5a5a; --ink-faint: #bcbcbc;
    --font-serif: "Times New Roman", Times, "Liberation Serif", Georgia, serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-serif); }
  body { padding: 0.9rem 1.1rem 1.1rem; }
  h1 { font-size: 0.95rem; font-weight: normal; font-style: italic; margin: 0 0 0.15rem; }
  .sub { font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 0.8rem; }
  table.masktbl { border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; width: 100%; margin: 0 0 0.6rem; }
  table.masktbl th, table.masktbl td { padding: 4px 8px; text-align: left; white-space: nowrap; }
  table.masktbl th { font-family: var(--font-serif); font-style: italic; font-weight: normal; font-size: 12.5px; border-bottom: 1px solid var(--ink); text-align: left; }
  table.masktbl td.dim { color: var(--ink-faint); }
  table.masktbl tr.off td { color: var(--ink-faint); font-style: italic; }
  table.masktbl tr.total td { border-top: 1px solid var(--ink); font-weight: bold; padding-top: 6px; }
  table.masktbl td.masked-cell { position: relative; }
  .masked-veil { letter-spacing: 1px; }
  .status-line { font-size: 12.5px; margin: 0.3rem 0 0; min-height: 1.2em; }
  .status-line.abort { font-weight: bold; }
  .status-line.ok { color: var(--ink-soft); }
  footer { display: flex; align-items: center; gap: 1rem; margin-top: 0.6rem; flex-wrap: wrap; }
  button.ctl {
    font-family: var(--font-serif); font-size: 0.82rem; background: none; border: none;
    color: var(--ink); cursor: pointer; padding: 0.1rem 0; border-bottom: 1px solid transparent;
  }
  button.ctl:hover, button.ctl:focus-visible { border-bottom-color: var(--ink); }
  .valctl { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; }
  .valctl button {
    font-family: var(--font-mono); font-size: 0.72rem; width: 16px; height: 16px; line-height: 1;
    border: 1px solid var(--ink); background: var(--bg); cursor: pointer; padding: 0;
  }
  .hint { font-size: 0.72rem; color: var(--ink-soft); font-style: italic; }
  .farm-name { cursor: pointer; }
  .farm-name:hover { text-decoration: underline; }
</style>

<h1>secure aggregation: what the server actually receives</h1>
<p class="sub">every client's true vector gets a random mask added before it leaves the client. the masks are built to cancel out once summed</p>

<table class="masktbl" id="maskTable"></table>
<p class="status-line" id="statusLine"></p>

<footer>
  <button class="ctl" id="runBtn">[ run round ]</button>
  <button class="ctl" id="maskToggle">masking: <span class="bracket">[</span><span id="maskVal">on</span><span class="bracket">]</span></button>
  <span class="valctl">&tau;=<span id="thVal">2</span>
    <button id="thMinus">&minus;</button><button id="thPlus">+</button>
  </span>
  <span class="hint">click a farm's name to drop it, then drop enough to fall below &tau; and the round aborts</span>
</footer>

<script>
(function () {
  "use strict";
  function fmt(x) { return (x >= 0 ? " " : "") + x.toFixed(2); }
  function vec(v) { return "(" + v.map(fmt).join(", ") + ")"; }
  function randVec() {
    return [Math.round((Math.random() * 2 - 1) * 100) / 100, Math.round((Math.random() * 2 - 1) * 100) / 100];
  }
  function addVecs(vecs) {
    return vecs.reduce(function (acc, v) { return [acc[0] + v[0], acc[1] + v[1]]; }, [0, 0]);
  }
  function subVec(a, b) { return [a[0] - b[0], a[1] - b[1]]; }

  var clients = [
    { id: "A", w: [0, 0], mask: [0, 0], online: true },
    { id: "B", w: [0, 0], mask: [0, 0], online: true },
    { id: "C", w: [0, 0], mask: [0, 0], online: true }
  ];
  var state = { masking: true, threshold: 2 };

  var maskTable = document.getElementById("maskTable");
  var statusLine = document.getElementById("statusLine");

  function onlineClients() { return clients.filter(function (c) { return c.online; }); }

  // Masks are drawn so that, across every client (online or not), they sum
  // to exactly zero -- the last client's mask is whatever value makes that
  // true. This is a simplified stand-in for the real protocol's pairwise
  // Diffie-Hellman-derived masks, which cancel the same way but per pair of
  // clients rather than via one shared total.
  function reroll() {
    var free = clients.slice(0, clients.length - 1);
    free.forEach(function (c) { c.mask = randVec(); c.w = randVec(); });
    var last = clients[clients.length - 1];
    last.w = randVec();
    var sumOthers = addVecs(free.map(function (c) { return c.mask; }));
    last.mask = [-sumOthers[0], -sumOthers[1]];
  }

  function renderTable() {
    maskTable.innerHTML = "";
    var thead = document.createElement("tr");
    thead.innerHTML = "<th>client</th><th>true w<sub>u</sub></th><th>mask</th><th>server receives</th>";
    maskTable.appendChild(thead);

    clients.forEach(function (c) {
      var row = document.createElement("tr");
      if (!c.online) row.className = "off";
      var masked = addVecs([c.w, c.mask]);
      var nameCell = "<td class='farm-name' data-id='" + c.id + "'>farm " + c.id + (c.online ? "" : " (dropped)") + "</td>";
      var wCell = "<td>" + vec(c.w) + "</td>";
      var maskCell = "<td class='dim'>" + (state.masking ? "+ " + vec(c.mask) : "&mdash;") + "</td>";
      var seenCell;
      if (!c.online) {
        seenCell = "<td class='dim'>&mdash;</td>";
      } else if (state.masking) {
        seenCell = "<td class='masked-veil'>" + vec(masked) + "</td>";
      } else {
        seenCell = "<td>" + vec(c.w) + "</td>";
      }
      row.innerHTML = nameCell + wCell + maskCell + seenCell;
      maskTable.appendChild(row);
    });

    var online = onlineClients();
    var aborted = state.masking && online.length < state.threshold;
    var trueSum = addVecs(online.map(function (c) { return c.w; }));

    if (!aborted) {
      var totalRow = document.createElement("tr");
      totalRow.className = "total";
      var seenSum = state.masking
        ? addVecs(online.map(function (c) { return addVecs([c.w, c.mask]); }))
        : trueSum;
      totalRow.innerHTML = "<td>sum of survivors</td><td colspan='2'></td><td>&Sigma; = " + vec(seenSum) + "</td>";
      maskTable.appendChild(totalRow);
    }

    renderStatus(online, aborted, trueSum);
  }

  function renderStatus(online, aborted, trueSum) {
    if (aborted) {
      statusLine.className = "status-line abort";
      statusLine.textContent = "only " + online.length + "/" + state.threshold + " survivors, round ABORTED: nothing revealed";
      return;
    }
    statusLine.className = "status-line ok";
    if (state.masking) {
      statusLine.textContent = "the masks above cancel exactly. the sum the server recovers matches Σw = " + vec(trueSum) + ", even though no individual masked value looks anything like the true w it came from.";
    } else {
      statusLine.textContent = "masking is off, so the server reads every client's true w directly.";
    }
  }

  function renderAll() {
    renderTable();
    document.getElementById("thVal").textContent = state.threshold;
  }

  document.getElementById("runBtn").addEventListener("click", function () {
    reroll();
    renderAll();
  });

  document.getElementById("maskToggle").addEventListener("click", function () {
    state.masking = !state.masking;
    document.getElementById("maskVal").textContent = state.masking ? "on" : "off";
    renderAll();
  });

  document.getElementById("thMinus").addEventListener("click", function () {
    state.threshold = Math.max(1, state.threshold - 1);
    renderAll();
  });
  document.getElementById("thPlus").addEventListener("click", function () {
    state.threshold = Math.min(clients.length, state.threshold + 1);
    renderAll();
  });

  maskTable.addEventListener("click", function (e) {
    var cell = e.target.closest(".farm-name");
    if (!cell) return;
    var c = clients.filter(function (x) { return x.id === cell.dataset.id; })[0];
    if (c) { c.online = !c.online; renderAll(); }
  });

  reroll();
  renderAll();
})();
</script>
