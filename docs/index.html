<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suryansh Singh Shekhawat</title>
<script src="js/theme.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=clean11">
</head>
<body>

<div id="reading-progress" class="reading-progress" hidden><div id="reading-progress-bar"></div></div>

<header class="site-header">
  <canvas id="nav-bg" class="nav-bg" aria-hidden="true"></canvas>
  <nav class="site-nav">
    <a class="brand" href="#about" aria-label="About">
      <img class="brand-logo" src="img/m1c-logo.png" alt="1 Mach Collective" width="174" height="102">
    </a>
    <div class="nav-links">
      <button class="nav-link" data-section="articles">Articles</button>
      <button class="nav-link" data-section="projects">Projects</button>
      <button class="nav-link" data-section="notes">Notes</button>
      <button class="nav-link" data-section="publications">Publications</button>
      <button class="nav-link" data-section="misc">Misc</button>
      <button class="nav-link" data-section="about">About</button>
    </div>
    <span class="nav-divider" aria-hidden="true"></span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
  </nav>
</header>

<main id="content">

  <section id="about" class="panel">
    <div class="about-block">
      <h1 class="site-name">Suryansh Singh Shekhawat</h1>
      <p class="site-tagline">I like ML and here is some of what I am upto</p>
      <div class="socials">
        <a class="social-link" href="https://www.linkedin.com/in/suryansh-singh-shekhawat-64883a1a4/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.52-2.25 3.1V21H9z"/></svg>
          LinkedIn
        </a>
        <a class="social-link" href="https://www.instagram.com/suryanshshk/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>
      </div>
    </div>
  </section>

  <section id="articles" class="panel">
    <div class="section-head">
      <h1 class="section-title">Articles</h1><span id="articles-count" class="section-count"></span>
      <label class="search" for="articles-search"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.5 3.5"/></svg><input type="search" id="articles-search" placeholder="Search articles" autocomplete="off" spellcheck="false"><kbd class="search-key" aria-hidden="true">/</kbd></label>
    </div>
    <div id="articles-topics" class="topic-chips" hidden></div>
    <div id="articles-list" class="notes-list" data-empty="Nothing here yet. Articles, including my takes on AI, are on the way."></div>

    <div id="article-detail" class="notes-detail" hidden>
      <button id="back-to-articles" class="back-link">&larr; Back to articles</button>
      <h3 id="article-title" class="note-title"></h3>
      <div id="article-downloads" class="note-downloads"></div>
      <div id="article-pdf-viewer" class="pdf-viewer"></div>
      <div id="article-comments" class="comments"></div>
    </div>
  </section>

  <section id="projects" class="panel">
    <div class="section-head"><h1 class="section-title">Projects</h1><span id="projects-count" class="section-count"></span></div>
    <div id="projects-list" class="notes-list"></div>

    <div id="project-detail" class="notes-detail" hidden>
      <button id="back-to-projects" class="back-link">&larr; Back to projects</button>
      <div class="project-layout">
        <nav id="project-nav" class="project-nav"></nav>
        <div class="project-main">
          <div id="project-content" class="project-content"></div>
          <div id="project-comments" class="comments"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="notes" class="panel">
    <div class="section-head">
      <h1 class="section-title">Notes</h1><span id="notes-count" class="section-count"></span>
      <label class="search" for="notes-search"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.5 3.5"/></svg><input type="search" id="notes-search" placeholder="Search notes" autocomplete="off" spellcheck="false"><kbd class="search-key" aria-hidden="true">/</kbd></label>
      <div id="notes-view" class="view-toggle" role="group" aria-label="View">
        <button type="button" data-view="list" aria-pressed="true"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4h8M5 8h8M5 12h8"/><circle cx="2.5" cy="4" r=".6" fill="currentColor"/><circle cx="2.5" cy="8" r=".6" fill="currentColor"/><circle cx="2.5" cy="12" r=".6" fill="currentColor"/></svg>List</button>
        <button type="button" data-view="graph" aria-pressed="false"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="3" r="1.8"/><circle cx="3.5" cy="13" r="1.8"/><circle cx="12.5" cy="13" r="1.8"/><path d="M7 4.6 4.5 11.4M9 4.6l2.5 6.8"/></svg>Graph</button>
      </div>
    </div>
    <div id="notes-topics" class="topic-chips" role="toolbar" aria-label="Filter notes by topic" hidden></div>
    <div id="notes-list" class="notes-list"></div>
    <div id="notes-graph" class="notes-graph"></div>

    <div id="notes-detail" class="notes-detail" hidden>
      <button id="back-to-notes" class="back-link">&larr; Back to notes</button>
      <h3 id="note-title" class="note-title"></h3>
      <div id="note-downloads" class="note-downloads"></div>
      <div id="note-pdf-viewer" class="pdf-viewer"></div>
      <div id="note-comments" class="comments"></div>
    </div>
  </section>

  <section id="misc" class="panel">
    <div class="section-head">
      <h1 class="section-title">Miscellaneous</h1><span id="misc-count" class="section-count"></span>
      <label class="search" for="misc-search"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.5 3.5"/></svg><input type="search" id="misc-search" placeholder="Search" autocomplete="off" spellcheck="false"><kbd class="search-key" aria-hidden="true">/</kbd></label>
    </div>
    <p class="section-intro">Side interests outside machine learning: mathematics notes and older write-ups.</p>
    <div id="misc-list" class="notes-list"></div>

    <div id="misc-detail" class="notes-detail" hidden>
      <button id="back-to-misc" class="back-link">&larr; Back to miscellaneous</button>
      <h3 id="misc-title" class="note-title"></h3>
      <div id="misc-downloads" class="note-downloads"></div>
      <div id="misc-pdf-viewer" class="pdf-viewer"></div>
      <div id="misc-comments" class="comments"></div>
    </div>
  </section>

  <section id="publications" class="panel">
    <div class="section-head"><h1 class="section-title">Publications</h1></div>
    <ul class="entry-list">
      <li class="entry-placeholder">No publications listed yet — check back soon.</li>
    </ul>
  </section>

</main>

<div id="view-counter" class="view-counter" role="status" title="Visits (a new tab or session counts once) and unique browsers (counted once per browser). No personal data is stored; counts are kept by a third-party counter service." hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/thumbs.js?v=3"></script>
<script src="js/timeline.js?v=4"></script>
<script src="js/notes-graph.js?v=4"></script>
<script src="js/app.js?v=sbx15"></script>
<script src="js/views.js?v=1"></script>
</body>
</html>
