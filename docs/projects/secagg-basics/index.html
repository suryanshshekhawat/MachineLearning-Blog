<meta charset="utf-8" />
<title>Secure Aggregation — basics</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff; --ink: #000000; --ink-soft: #5a5a5a; --ink-faint: #bcbcbc;
    --font-serif: "Times New Roman", Times, "Liberation Serif", Georgia, serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-serif); }
  body { padding: 0.9rem 1.1rem 1.1rem; }
  h1 { font-size: 0.95rem; font-weight: normal; font-style: italic; margin: 0 0 0.15rem; }
  .sub { font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 0.8rem; }
  #stage { width: 100%; height: auto; display: block; }
  .client-box { fill: var(--bg); stroke: var(--ink); stroke-width: 1; cursor: pointer; }
  .client-box.off { stroke-dasharray: 3 3; stroke: var(--ink-faint); }
  .client-group:hover .client-box { stroke-width: 1.6; }
  .client-label { font-family: var(--font-serif); font-style: italic; font-size: 13px; }
  .client-val { font-family: var(--font-mono); font-size: 12px; }
  .client-val.off { fill: var(--ink-faint); }
  .server-box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.4; }
  .server-label { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
  .link { stroke: var(--ink); stroke-width: 1; }
  .link.off { stroke: var(--ink-faint); stroke-dasharray: 1 4; }
  .packet { fill: var(--bg); stroke: var(--ink); stroke-width: 1; }
  .packet.masked { fill: url(#hatch); }
  .packet-txt { font-family: var(--font-mono); font-size: 9px; }
  .eq { font-family: var(--font-serif); font-style: italic; font-size: 13px; }
  .eq.abort { font-weight: bold; }
  footer { display: flex; align-items: center; gap: 1rem; margin-top: 0.6rem; flex-wrap: wrap; }
  button.ctl {
    font-family: var(--font-serif); font-size: 0.82rem; background: none; border: none;
    color: var(--ink); cursor: pointer; padding: 0.1rem 0; border-bottom: 1px solid transparent;
  }
  button.ctl:hover, button.ctl:focus-visible { border-bottom-color: var(--ink); }
  .valctl { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; }
  .valctl button {
    font-family: var(--font-mono); font-size: 0.72rem; width: 16px; height: 16px; line-height: 1;
    border: 1px solid var(--ink); background: var(--bg); cursor: pointer; padding: 0;
  }
  .hint { font-size: 0.72rem; color: var(--ink-soft); font-style: italic; }
</style>

<h1>secure aggregation &mdash; what the server actually sees</h1>
<p class="sub">each client masks its number before sending it; the masks cancel only when everything is summed</p>

<svg id="stage" viewBox="0 0 640 220">
  <defs>
    <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="var(--bg)"></rect>
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="1.2"></line>
    </pattern>
  </defs>
  <g id="links"></g>
  <g id="packets"></g>
  <g id="clients"></g>
  <g id="server"></g>
  <g id="eqLayer"></g>
</svg>

<footer>
  <button class="ctl" id="runBtn">[ run round ]</button>
  <button class="ctl" id="maskToggle">masking: <span class="bracket">[</span><span id="maskVal">on</span><span class="bracket">]</span></button>
  <span class="valctl">τ=<span id="thVal">2</span>
    <button id="thMinus">&minus;</button><button id="thPlus">+</button>
  </span>
  <span class="hint">click a client box to drop it &mdash; drop enough to fall below τ and the round aborts</span>
</footer>

<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  function make(tag, attrs, text) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  var clients = [
    { id: "A", x: 90, val: 0, online: true },
    { id: "B", x: 320, val: 0, online: true },
    { id: "C", x: 550, val: 0, online: true }
  ];
  var SERVER = { x: 320, y: 40 };
  var BOX_TOP = 130, BOX_W = 120, BOX_H = 50;
  var state = { masking: true, threshold: 2 };

  var linksLayer = document.getElementById("links");
  var packetsLayer = document.getElementById("packets");
  var clientsLayer = document.getElementById("clients");
  var serverLayer = document.getElementById("server");
  var eqLayer = document.getElementById("eqLayer");

  function onlineClients() { return clients.filter(function (c) { return c.online; }); }

  function renderServer() {
    serverLayer.innerHTML = "";
    var w = 130, h = 46;
    serverLayer.appendChild(make("rect", { class: "server-box", x: SERVER.x - w / 2, y: SERVER.y - h / 2, width: w, height: h }));
    serverLayer.appendChild(make("text", { x: SERVER.x, y: SERVER.y + 5, "text-anchor": "middle", class: "server-label" }, "server"));
  }

  function renderClients() {
    clientsLayer.innerHTML = "";
    linksLayer.innerHTML = "";
    packetsLayer.innerHTML = "";
    clients.forEach(function (c) {
      linksLayer.appendChild(make("line", {
        class: "link" + (c.online ? "" : " off"),
        x1: SERVER.x, y1: SERVER.y + 23, x2: c.x, y2: BOX_TOP
      }));

      if (c.online) {
        var mx = (SERVER.x + c.x) / 2, my = (SERVER.y + 23 + BOX_TOP) / 2;
        packetsLayer.appendChild(make("rect", { class: "packet" + (state.masking ? " masked" : ""), x: mx - 14, y: my - 10, width: 28, height: 20 }));
        packetsLayer.appendChild(make("text", {
          x: mx, y: my + 4, "text-anchor": "middle", class: "packet-txt"
        }, state.masking ? "?" : c.val.toFixed(2)));
      }

      var g = make("g", { class: "client-group", tabindex: "0", role: "button" });
      g.appendChild(make("rect", { class: "client-box" + (c.online ? "" : " off"), x: c.x - BOX_W / 2, y: BOX_TOP, width: BOX_W, height: BOX_H }));
      g.appendChild(make("text", { x: c.x, y: BOX_TOP + 20, "text-anchor": "middle", class: "client-label" }, "farm " + c.id));
      g.appendChild(make("text", { x: c.x, y: BOX_TOP + 38, "text-anchor": "middle", class: "client-val" + (c.online ? "" : " off") },
        "w=" + c.val.toFixed(2)));
      g.addEventListener("click", function () { c.online = !c.online; renderAll(); });
      clientsLayer.appendChild(g);
    });
  }

  function renderEq() {
    eqLayer.innerHTML = "";
    var online = onlineClients();
    var aborted = state.masking && online.length < state.threshold;
    var text, cls = "eq";
    if (aborted) {
      text = "only " + online.length + "/" + state.threshold + " survivors — round ABORTED, Σ=∅ (nothing revealed)";
      cls += " abort";
    } else {
      var sum = online.reduce(function (s, c) { return s + c.val; }, 0);
      text = state.masking
        ? "server receives " + online.length + " masked values it cannot read — masks cancel — Σw = " + sum.toFixed(3)
        : "masking off — server reads each w directly — Σw = " + sum.toFixed(3);
    }
    eqLayer.appendChild(make("text", { x: 320, y: 210, "text-anchor": "middle", class: cls }, text));
  }

  function renderAll() {
    renderClients();
    renderServer();
    renderEq();
    document.getElementById("thVal").textContent = state.threshold;
  }

  document.getElementById("runBtn").addEventListener("click", function () {
    clients.forEach(function (c) { if (c.online) c.val = Math.round((Math.random() * 2 - 1) * 100) / 100; });
    renderAll();
  });

  document.getElementById("maskToggle").addEventListener("click", function () {
    state.masking = !state.masking;
    document.getElementById("maskVal").textContent = state.masking ? "on" : "off";
    renderAll();
  });

  document.getElementById("thMinus").addEventListener("click", function () {
    state.threshold = Math.max(1, state.threshold - 1);
    renderAll();
  });
  document.getElementById("thPlus").addEventListener("click", function () {
    state.threshold = Math.min(clients.length, state.threshold + 1);
    renderAll();
  });

  clients.forEach(function (c) { c.val = Math.round((Math.random() * 2 - 1) * 100) / 100; });
  renderAll();
})();
</script>
