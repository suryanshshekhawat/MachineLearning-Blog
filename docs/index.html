<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suryansh Singh Shekhawat</title>
<script src="js/theme.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=clean3">
</head>
<body>

<div id="reading-progress" class="reading-progress" hidden><div id="reading-progress-bar"></div></div>

<header class="site-header">
  <nav class="site-nav">
    <a class="brand" href="#about">
      <span class="brand-mark" aria-hidden="true"><canvas width="32" height="32" data-anim="mach" data-seed="brand"></canvas></span>
      <span class="brand-name">Suryansh Singh Shekhawat</span>
    </a>
    <div class="nav-links">
      <button class="nav-link" data-section="articles">Articles</button>
      <button class="nav-link" data-section="projects">Projects</button>
      <button class="nav-link" data-section="notes">Notes</button>
      <button class="nav-link" data-section="publications">Publications</button>
      <button class="nav-link" data-section="about">About</button>
    </div>
    <span class="nav-divider" aria-hidden="true"></span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
  </nav>
</header>

<main id="content">

  <section id="about" class="panel">
    <div class="about-block">
      <img class="profile-photo" src="img/profile.jpg" alt="Suryansh Singh Shekhawat" id="profile-photo">
      <div>
        <h1 class="site-name">Suryansh Singh Shekhawat</h1>
        <p class="site-tagline">I like ML and here is some of what I am upto</p>
      </div>
    </div>
  </section>

  <section id="articles" class="panel">
    <div class="section-head"><h1 class="section-title">Articles</h1><span id="articles-count" class="section-count"></span></div>
    <div id="articles-topics" class="topic-chips" hidden></div>
    <div id="articles-list" class="notes-list"></div>

    <div id="article-detail" class="notes-detail" hidden>
      <button id="back-to-articles" class="back-link">&larr; Back to articles</button>
      <h3 id="article-title" class="note-title"></h3>
      <div id="article-downloads" class="note-downloads"></div>
      <div id="article-pdf-viewer" class="pdf-viewer"></div>
      <div id="article-comments" class="comments"></div>
    </div>
  </section>

  <section id="projects" class="panel">
    <div class="section-head"><h1 class="section-title">Projects</h1><span id="projects-count" class="section-count"></span></div>
    <div id="projects-list" class="notes-list"></div>

    <div id="project-detail" class="notes-detail" hidden>
      <button id="back-to-projects" class="back-link">&larr; Back to projects</button>
      <div class="project-layout">
        <nav id="project-nav" class="project-nav"></nav>
        <div class="project-main">
          <div id="project-content" class="project-content"></div>
          <div id="project-comments" class="comments"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="notes" class="panel">
    <div class="section-head"><h1 class="section-title">Notes</h1><span id="notes-count" class="section-count"></span></div>
    <div id="notes-topics" class="topic-chips" role="toolbar" aria-label="Filter notes by topic" hidden></div>
    <div id="notes-list" class="notes-list"></div>

    <div id="notes-detail" class="notes-detail" hidden>
      <button id="back-to-notes" class="back-link">&larr; Back to notes</button>
      <h3 id="note-title" class="note-title"></h3>
      <div id="note-downloads" class="note-downloads"></div>
      <div id="note-pdf-viewer" class="pdf-viewer"></div>
      <div id="note-comments" class="comments"></div>
    </div>
  </section>

  <section id="publications" class="panel">
    <div class="section-head"><h1 class="section-title">Publications</h1></div>
    <ul class="entry-list">
      <li class="entry-placeholder">No publications listed yet — check back soon.</li>
    </ul>
  </section>

</main>

<div id="view-counter" class="view-counter" role="status" title="Visits (a new tab or session counts once) and unique browsers (counted once per browser). No personal data is stored; counts are kept by a third-party counter service." hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/thumbs.js?v=1"></script>
<script src="js/app.js?v=sbx9"></script>
<script src="js/views.js?v=1"></script>
</body>
</html>
