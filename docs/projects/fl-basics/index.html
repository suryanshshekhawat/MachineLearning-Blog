<meta charset="utf-8" />
<title>Federated Averaging: basics</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff; --ink: #000000; --ink-soft: #5a5a5a; --ink-faint: #bcbcbc;
    --font-serif: "Times New Roman", Times, "Liberation Serif", Georgia, serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-serif); }
  body { padding: 0.9rem 1.1rem 1.1rem; }
  h1 { font-size: 0.95rem; font-weight: normal; font-style: italic; margin: 0 0 0.15rem; }
  .sub { font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 0.9rem; }
  #stage { width: 100%; height: auto; display: block; }
  .client-box { fill: var(--bg); stroke: var(--ink); stroke-width: 1; cursor: pointer; }
  .client-box.off { stroke-dasharray: 3 3; stroke: var(--ink-faint); }
  .client-group:hover .client-box { stroke-width: 1.6; }
  .client-label { font-family: var(--font-serif); font-style: italic; font-size: 13px; }
  .client-sub { font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-soft); }
  .client-val { font-family: var(--font-mono); font-size: 12px; }
  .client-val.off { fill: var(--ink-faint); }
  .server-box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.4; }
  .server-label { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
  .link { stroke: var(--ink); stroke-width: 1; }
  .link.off { stroke: var(--ink-faint); stroke-dasharray: 1 4; }
  table.arith { border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; margin: 0.6rem auto 0; }
  table.arith td { padding: 2px 8px; white-space: nowrap; }
  table.arith td.op { color: var(--ink-soft); width: 1.2em; text-align: center; }
  table.arith td.vec { text-align: left; }
  table.arith tr.total td { border-top: 1px solid var(--ink); padding-top: 5px; font-weight: bold; }
  .arith-wrap { text-align: center; }
  .off-note { color: var(--ink-faint); font-style: italic; }
  footer { display: flex; align-items: center; gap: 1rem; margin-top: 0.7rem; flex-wrap: wrap; }
  button.ctl {
    font-family: var(--font-serif); font-size: 0.82rem; background: none; border: none;
    color: var(--ink); cursor: pointer; padding: 0.1rem 0; border-bottom: 1px solid transparent;
  }
  button.ctl:hover { border-bottom-color: var(--ink); }
  .hint { font-size: 0.72rem; color: var(--ink-soft); font-style: italic; }
</style>

<h1>federated averaging: three clients, one aggregate</h1>
<p class="sub">each client trains locally on its own data and reports back a small weight vector, not the data itself</p>

<svg id="stage" viewBox="0 0 640 190">
  <g id="links"></g>
  <g id="clients"></g>
  <g id="server"></g>
</svg>

<div class="arith-wrap"><table class="arith" id="arithTable"></table></div>

<footer>
  <button class="ctl" id="runBtn">[ run round ]</button>
  <span class="hint">click a farm's box to take it offline, then run another round and watch it drop out of the sum below</span>
</footer>

<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  function make(tag, attrs, text) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function fmt(x) { return (x >= 0 ? " " : "") + x.toFixed(2); }
  function vec(v) { return "(" + v.map(fmt).join(", ") + ")"; }
  function randVec() {
    return [Math.round((Math.random() * 2 - 1) * 100) / 100, Math.round((Math.random() * 2 - 1) * 100) / 100];
  }
  function scaleVec(s, v) { return v.map(function (x) { return s * x; }); }
  function addVecs(vecs) {
    return vecs.reduce(function (acc, v) { return [acc[0] + v[0], acc[1] + v[1]]; }, [0, 0]);
  }

  var clients = [
    { id: "A", n: 1000, x: 90, w: [0, 0], online: true },
    { id: "B", n: 2000, x: 320, w: [0, 0], online: true },
    { id: "C", n: 4000, x: 550, w: [0, 0], online: true }
  ];
  var SERVER = { x: 320, y: 40 };
  var BOX_TOP = 110, BOX_W = 130, BOX_H = 58;

  var linksLayer = document.getElementById("links");
  var clientsLayer = document.getElementById("clients");
  var serverLayer = document.getElementById("server");
  var arithTable = document.getElementById("arithTable");

  function totalN() {
    return clients.filter(function (c) { return c.online; }).reduce(function (s, c) { return s + c.n; }, 0);
  }

  function renderServer() {
    serverLayer.innerHTML = "";
    var w = 130, h = 46;
    serverLayer.appendChild(make("rect", { class: "server-box", x: SERVER.x - w / 2, y: SERVER.y - h / 2, width: w, height: h }));
    serverLayer.appendChild(make("text", { x: SERVER.x, y: SERVER.y + 5, "text-anchor": "middle", class: "server-label" }, "server"));
  }

  function renderClients() {
    clientsLayer.innerHTML = "";
    linksLayer.innerHTML = "";
    var n = totalN();
    clients.forEach(function (c) {
      linksLayer.appendChild(make("line", {
        class: "link" + (c.online ? "" : " off"),
        x1: SERVER.x, y1: SERVER.y + 23, x2: c.x, y2: BOX_TOP
      }));

      var g = make("g", { class: "client-group", tabindex: "0", role: "button" });
      g.appendChild(make("rect", { class: "client-box" + (c.online ? "" : " off"), x: c.x - BOX_W / 2, y: BOX_TOP, width: BOX_W, height: BOX_H }));
      g.appendChild(make("text", { x: c.x, y: BOX_TOP + 18, "text-anchor": "middle", class: "client-label" }, "farm " + c.id));
      g.appendChild(make("text", { x: c.x, y: BOX_TOP + 32, "text-anchor": "middle", class: "client-sub" },
        "n=" + c.n + (c.online ? "  weight=" + (n ? (c.n / n).toFixed(2) : "–") : "  (offline)")));
      g.appendChild(make("text", { x: c.x, y: BOX_TOP + 50, "text-anchor": "middle", class: "client-val" + (c.online ? "" : " off") },
        "w=" + vec(c.w)));
      g.addEventListener("click", function () { c.online = !c.online; renderAll(); });
      clientsLayer.appendChild(g);
    });
  }

  // The arithmetic panel is plain HTML (not SVG text) so multi-line vector
  // rows line up in a monospace table -- much easier to read than trying to
  // cram the same working into SVG <text> elements.
  function renderArith() {
    arithTable.innerHTML = "";
    var online = clients.filter(function (c) { return c.online; });
    var n = totalN();

    online.forEach(function (c, i) {
      var weight = c.n / n;
      var scaled = scaleVec(weight, c.w);
      var row = document.createElement("tr");
      row.innerHTML =
        "<td class='vec'>" + weight.toFixed(2) + " &times; " + vec(c.w) + "</td>" +
        "<td class='vec'>= " + vec(scaled) + "</td>" +
        "<td class='op'>" + (i < online.length - 1 ? "+" : "") + "</td>";
      arithTable.appendChild(row);
    });

    var weightedSum = addVecs(online.map(function (c) { return scaleVec(c.n / n, c.w); }));
    var totalRow = document.createElement("tr");
    totalRow.className = "total";
    totalRow.innerHTML = "<td class='vec' colspan='2'>w&prime; = " + vec(weightedSum) + "</td><td></td>";
    arithTable.appendChild(totalRow);

    if (online.length < clients.length) {
      var note = document.createElement("tr");
      note.innerHTML = "<td colspan='3' class='off-note'>(offline farms contribute nothing -- their weight is redistributed among the rest)</td>";
      arithTable.appendChild(note);
    }
  }

  function renderAll() {
    renderClients();
    renderServer();
    renderArith();
  }

  document.getElementById("runBtn").addEventListener("click", function () {
    clients.forEach(function (c) { if (c.online) c.w = randVec(); });
    renderAll();
  });

  clients.forEach(function (c) { c.w = randVec(); });
  renderAll();
})();
</script>
